name: Quality Gates
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kholil_growth_os?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/kholil_growth_os?schema=public
      AUTH_SECRET: ci-only-random-secret-change-before-production-123456789
      CRON_SECRET: ci-only-cron-secret-change-before-production-987654321
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml || (echo "pnpm-lock.yaml is required. Run pnpm install with pnpm 12.14.0, review and commit the generated lockfile." && exit 1)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma 7 client
        run: pnpm db:generate
      - name: Static syntax and dependency policy checks
        run: pnpm qa:static
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Production builds
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end smoke and access-control tests
        run: pnpm test:e2e
